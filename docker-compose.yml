services:
  app:
    build: .
    ports:
      - "3872:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DRAWIO_EXPORT_URL=http://drawio-export:8000
    depends_on:
      drawio-export:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  drawio-export:
    image: jgraph/export-server
    restart: unless-stopped
