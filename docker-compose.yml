services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - supabase
    environment:
      - NODE_ENV=production

  supabase:
    image: supabase/postgres:15.8.1.145
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - supabase-data:/var/lib/postgresql/data

volumes:
  supabase-data:
