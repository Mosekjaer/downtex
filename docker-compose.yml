services:
  app:
    build: .
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DRAWIO_EXPORT_URL=http://drawio-export:8000
    depends_on:
      drawio-export:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  drawio-export:
    image: jgraph/export-server
    restart: unless-stopped
